name: Keep Streamlit Alive

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  wake-app:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Open App and Wake if Sleeping
        run: |
          python - << 'EOF'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto("https://kitique.streamlit.app/", wait_until="domcontentloaded", timeout=60000)
              page.wait_for_timeout(10000)

              wake_btn = page.locator("button:has-text('Yes, get this app back up!')")
              if wake_btn.count() > 0:
                  print("App was sleeping. Clicking wake button...")
                  wake_btn.first.click()
                  page.wait_for_timeout(35000)
                  print("Wake-up triggered successfully!")
              else:
                  print("App is already awake! Waiting for WebSocket session...")
                  page.wait_for_timeout(10000)

              browser.close()
          EOF
